packages:
  - packages/*
  - apps/*

# pnpm 10 runs no dependency's install scripts unless it is named here. That is what keeps
# h5p-standalone's `preinstall: npx only-allow yarn` guard from failing the install — we only
# consume its prebuilt dist/ files — which npm needed `ignore-scripts=true` for, a setting that
# also silenced our own `prepublishOnly`. esbuild's postinstall only verifies its binary.
# @vscode/vsce-sign's copies this platform's signing binary out of its optional dependency (and
# downloads it from npm only when that is missing): `vsce publish` signs the VS Code extension with it.
onlyBuiltDependencies:
  - '@vscode/vsce-sign'
  - esbuild

# Named so the install says nothing about it: its only script is the yarn guard above.
ignoredBuiltDependencies:
  - h5p-standalone

# @vscode/vsce reaches @azure/msal-node through @azure/identity, whose range, ^6, has no release
# that fixes GHSA-xcx6-jx8p-x3h5 (high, Dependabot alert #3, opened when the VS Code extension
# merged): 7.1.0 is the first. So 7 is forced under @azure/identity alone, a major above its range
# (2026-10-28). vsce loads it for every command; with it `vsce package` writes the same .vsix, and
# vsce's Microsoft Entra sign-in, the one path that runs MSAL, fails here as it did on 6, with every
# credential unavailable rather than an error from a changed API. Remove this once @azure/identity
# takes 7: neither 4.14.0 nor 4.15.0-beta.1 does.
# @vscode/vsce takes minimatch ^10.2.6, and no 10 fixes GHSA-g3hv-75wg-m249 (medium, Dependabot alert
# #4): 11.0.1 is the first. vsce calls only `minimatch(path, pattern, { dot: true })`, to apply
# .vscodeignore, which 11 keeps; what 11 removed (makeRe, the AST, debug) it never calls. With 11,
# `vsce package` writes the same .vsix, every entry's name and CRC alike (2026-11-01). Remove this
# once vsce takes 11: 4.1.0 does not.
overrides:
  '@azure/identity>@azure/msal-node': ^7.1.0
  '@vscode/vsce>minimatch': ^11.0.1
