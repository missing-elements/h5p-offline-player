<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Play a file from disk — h5p-offline-player</title>
    <meta name="description" content="Hand the element a File from a picker and it is read with slice(), never loaded whole. The way around a host that sends no CORS headers." />
    <link rel="canonical" href="%SITE_URL%/demo/local-file.html" />
    <meta name="theme-color" content="#2f6df6" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="h5p-offline-player" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Play a file from disk — h5p-offline-player" />
    <meta property="og:description" content="Hand the element a File from a picker and it is read with slice(), never loaded whole. The way around a host that sends no CORS headers." />
    <meta property="og:url" content="%SITE_URL%/demo/local-file.html" />
    <meta property="og:image" content="%SITE_URL%/demo/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="h5p-offline-player: play H5P packages in the browser, with no server" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Play a file from disk — h5p-offline-player" />
    <meta name="twitter:description" content="Hand the element a File from a picker and it is read with slice(), never loaded whole. The way around a host that sends no CORS headers." />
    <meta name="twitter:image" content="%SITE_URL%/demo/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/demo/favicon.svg" />
    <link rel="stylesheet" href="/demo/player-page.css" />
    <script type="module" src="/src/h5p-offline-player.ts"></script>
  </head>

  <body>
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">H5</span>h5p-offline-player</a>
      <nav aria-label="Site">
        <a href="/">Player</a>
        <a href="/demo/setup.html">Setup</a>
        <a href="/demo/" aria-current="page">Examples</a>
        <a href="https://github.com/missing-elements/h5p-offline-player" rel="noopener">GitHub</a>
      </nav>
    </header>

    <main>
      <h1>A file from disk</h1>
      <p class="lede">
        The path out of a host with no CORS headers: download the archive by hand and hand the
        <code>File</code> to the element. It is read with <code>File.slice()</code> — never loaded
        into memory whole, however large it is.
      </p>

      <form class="controls">
        <label class="file">
          Choose a .h5p file
          <input type="file" id="file" accept=".h5p,application/zip" />
        </label>
        <span class="badge" id="state">idle</span>
      </form>

      <h5p-player auto-resize></h5p-player>

      <footer>
        <nav class="footer-links" aria-label="More on this site">
          <a href="/demo/">All examples</a>
          <a href="/">Player page</a>
        </nav>
      </footer>
    </main>

    <script type="module">
      const player = document.querySelector('h5p-player')
      const state = document.querySelector('#state')

      document.querySelector('#file').addEventListener('change', (event) => {
        const [file] = event.target.files
        if (file) player.file = file
      })

      player.addEventListener('statechange', (event) => (state.textContent = event.detail.state))
      player.addEventListener('resize', (event) => {
        player.style.height = `${Math.max(event.detail.height, 240)}px`
      })
    </script>
  </body>
</html>
