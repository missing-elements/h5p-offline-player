<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preview</title>
    <!-- The demo's page, from the player's dist/ beside its script: see design/verify.md. -->
    <link rel="stylesheet" href="/page.css" />
    <script type="module" src="/h5p-player.js"></script>
    <style>
      main { max-width: var(--content); margin: 0 auto; padding: 0 var(--gutter) 2rem; }
      .brand { white-space: normal; min-width: 0; }
      .brand-name strong { font-weight: 600; overflow-wrap: anywhere; }
      .topbar-actions { gap: 0.5rem; }
      .topbar-actions .button { min-height: 2.25rem; padding: 0.3rem 0.8rem; font-size: 0.9rem; text-decoration: none; }
      .topbar-actions .button svg { width: 1rem; height: 1rem; }
      .status { margin-top: 1rem; }
      h5p-player { margin-top: 1rem; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <span class="brand"><img class="brand-mark" src="/mark.svg" alt="" width="32" height="32" /><span class="brand-name"><strong id="name">Preview</strong><span class="brand-by">h5p-verify preview · by Missing Elements</span></span></span>
      <div class="topbar-actions">
        <a id="download" class="button" aria-describedby="name" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M4 19h16" /></svg>Download</a>
        <button type="button" class="icon-button theme-toggle" aria-label="Switch theme"><svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg><svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg></button>
      </div>
    </header>
    <main>
      <div class="status" id="status" role="status" data-state="indexing"><span class="badge" id="badge" data-state="indexing">Opening</span><span id="message">Opening…</span><span class="timer" id="timer">0.0 s</span></div>
      <h5p-player></h5p-player>
    </main>
    <script type="application/json" id="settings">{{settings}}</script>
    <script>
      const settings = JSON.parse(document.getElementById('settings').textContent)
      const player = document.querySelector('h5p-player')
      const status = document.getElementById('status')
      const badge = document.getElementById('badge')
      const message = document.getElementById('message')
      const timer = document.getElementById('timer')
      const download = document.getElementById('download')
      document.title = `${settings.name} · preview`
      document.getElementById('name').textContent = settings.name
      // The element as the check sets it: the same libraries, played the same way.
      if (settings.libraries) player.setAttribute('libraries', settings.libraries)
      if (settings.packBase) player.setAttribute('pack-base', settings.packBase)
      if (!settings.refreshLibraries) player.setAttribute('refresh-libraries', 'off')
      // `false` only: a preview page from before the option said nothing, and the element's default is on.
      if (settings.downgradeLibraries === false) player.setAttribute('downgrade-libraries', 'off')
      if (settings.untrusted) player.untrusted = true
      // Set once its server has gone. A load still under way changes state after that, and its
      // "Opening…" or the error of a request that failed would write over the page saying so.
      let ended = false

      // The strip under the bar, as the demo's: the state as a dot and a word, the message, and the
      // seconds since the page opened, frozen once the content is up or the load has failed.
      const started = performance.now()
      let frozen = false
      setInterval(() => {
        if (!frozen) timer.textContent = `${((performance.now() - started) / 1000).toFixed(1)} s`
      }, 100)
      const show = (state, text) => {
        status.dataset.state = badge.dataset.state = state
        badge.textContent = state === 'ready' ? 'Ready' : state === 'error' ? 'Error' : 'Opening'
        message.textContent = text
      }

      player.addEventListener('statechange', (event) => {
        if (ended) return
        const { state } = event.detail
        if (state === 'ready') {
          frozen = true
          show('ready', settings.untrusted
            ? 'Played untrusted, as a site that did not make it plays it. Close this tab to end the preview.'
            : 'Close this tab to end the preview.')
        } else if (state !== 'error') show('indexing', 'Opening…')
      })
      player.addEventListener('error', (event) => {
        // An error once the content is up leaves it running; before that, the package did not open.
        if (!ended && player.state !== 'ready') {
          frozen = true
          show('error', event.detail.message)
        }
      })
      // Only a web address becomes `src`: never a `javascript:` or `data:` URL. The Download link
      // takes the same address, so that whoever reviews the package can keep the file they played.
      try {
        const src = new URL(settings.src, window.location.href)
        if (src.protocol === 'http:' || src.protocol === 'https:') {
          player.setAttribute('src', src.href)
          download.href = src.href
          download.download = settings.name
          download.hidden = false
        } else {
          frozen = true
          show('error', 'Invalid preview source.')
        }
      } catch {
        frozen = true
        show('error', 'Invalid preview source.')
      }

      // Held open while this tab shows the preview: the command ends once no tab does. Once its
      // server has gone the page stops asking, so that it cannot keep a later preview alive.
      const presence = new EventSource('/__preview/events')
      presence.addEventListener('error', () => {
        ended = true
        frozen = true
        presence.close()
        // Its server, which the link downloads from, has gone with it.
        download.hidden = true
        show('error', 'The preview has ended. Run the command again to open it.')
      })

      // The theme switch, as the demo's theme.js: following the system, or pinned to the other theme.
      const root = document.documentElement
      const system = matchMedia('(prefers-color-scheme: dark)')
      const stored = () => {
        try {
          const value = localStorage.getItem('theme')
          return value === 'light' || value === 'dark' ? value : null
        } catch {
          return null
        }
      }
      const pin = (theme) => {
        if (theme) root.dataset.theme = theme
        else delete root.dataset.theme
      }
      const shown = () => root.dataset.theme || (system.matches ? 'dark' : 'light')
      pin(stored())
      const toggle = document.querySelector('.theme-toggle')
      const describe = () => {
        const text = `Switch to the ${shown() === 'dark' ? 'light' : 'dark'} theme`
        toggle.setAttribute('aria-label', text)
        toggle.title = text
      }
      toggle.addEventListener('click', () => {
        const next = shown() === 'dark' ? 'light' : 'dark'
        const choice = next === (system.matches ? 'dark' : 'light') ? null : next
        pin(choice)
        try {
          if (choice) localStorage.setItem('theme', choice)
          else localStorage.removeItem('theme')
        } catch {
          // No storage: the choice holds for this page and no longer.
        }
        describe()
      })
      system.addEventListener('change', describe)
      describe()
    </script>
  </body>
</html>
