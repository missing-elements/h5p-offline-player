name: Library pack

# Rebuilds packages/libraries from the H5P hub every week and opens a pull request when a library
# changed. The pack is built deterministically, in any time zone, so an unchanged hub leaves the
# tree clean.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: library-pack
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm libraries

      - name: Open a pull request if a library changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- packages/libraries; then
            echo "The hub has not changed."
            exit 0
          fi

          branch=libraries/refresh
          # Every library's line, `<folder>  <version>  <licence>`, FontAwesome and jQuery.ui among them.
          changes=$(git diff -U0 -- packages/libraries/libraries.txt | grep -E '^[-+][A-Za-z][^ ]*-[0-9]+\.[0-9]+  ' | sort -k1.2 || true)
          if [ -z "$changes" ]; then
            # The files changed and no library's version, licence or authors did: the build is not
            # deterministic, as it was once in the builder's time zone (#51), or the hub changed a
            # library's files without a new version. Either way a pull request would say the hub
            # changed when no library did.
            echo "::error::The pack's files changed, but no library in libraries.txt did. Rebuild with pnpm libraries and compare the archives' entries before releasing anything."
            git status --short -- packages/libraries | head -20
            exit 1
          fi

          version=$(node -e "
            const fs = require('fs'), path = 'packages/libraries/package.json'
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
            const [major, minor, patch] = pkg.version.split('.').map(Number)
            pkg.version = [major, minor, patch + 1].join('.')
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\\n')
            console.log(pkg.version)")
          # The player's libraries="pack" pins this version and carries its parts' index: stamp
          # both in the same change.
          pnpm --filter @missing-elements/h5p-offline-player sync:assets

          # Every content type played against the new pack, for the review: CI does not start on
          # a pull request a workflow opened, so the result goes into its description.
          pnpm build > /dev/null
          if pnpm sweep --out "$RUNNER_TEMP/sweep" > "$RUNNER_TEMP/sweep.log" 2>&1; then
            sweep="Every content type plays against the new pack, untrusted and trusted (\`pnpm sweep\`)."
          else
            sweep="**Some content types fail against the new pack** (\`pnpm sweep\`): see the report below."
          fi
          report=$(cat "$RUNNER_TEMP/sweep/report.md" 2>/dev/null || tail -n 30 "$RUNNER_TEMP/sweep.log")

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add packages/libraries packages/player/src/shared/constants.ts packages/player/src/shared/pack-index.ts
          git commit -m "chore(libraries): refresh from the H5P hub, $version"
          git push --force origin "$branch"

          body=$(printf '%s\n' \
            "The weekly rebuild of the library pack found changes on the H5P hub." \
            "" \
            "Before merging: play a package exported without its libraries against the new pack:" \
            "" \
            "\`pnpm verify <package> --libraries https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$branch/packages/libraries/libraries.h5p\`" \
            "" \
            "Then push to this branch, or close and reopen the pull request, to run CI: it does not start on a pull" \
            "request opened by a workflow. After merging, publish \`@missing-elements/h5p-libraries\`" \
            "$version with pnpm, before the next player release: the player's \`libraries=\"pack\"\` now names it," \
            "and its prepublishOnly refuses a pack version that is not on npm." \
            "" \
            '```diff' "$changes" '```' \
            "" \
            "$sweep" \
            "" \
            "<details><summary>The sweep's report</summary>" \
            "" \
            "$report" \
            "" \
            "</details>")

          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "Library pack $version" --body "$body"
          elif ! gh pr create --base main --head "$branch" --title "Library pack $version" --body "$body"; then
            # Opening a pull request needs "Allow GitHub Actions to create and approve pull
            # requests" in the repository's Actions settings; without it the branch is still pushed.
            echo "::warning::Could not open the pull request. Open it from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch"
            printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          fi
