name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Without --with-deps: the runner image ships Chrome and Firefox, so the libraries they link
      # against are there, and what apt would add (fonts, Xvfb, FFmpeg's codecs) a headless suite that
      # decodes no video does not use. Some runners reach Ubuntu's mirror at 40 kB/s, where that took
      # up to 20 minutes (#73).
      - run: pnpm --filter @missing-elements/h5p-offline-player exec playwright install chromium
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:demo

  # The player's browser suite and the installable app's tests in the other two engines; the job above runs
  # them in Chromium. One engine per job: the dev server's switches are shared, and two engines
  # would flip them under each other. Firefox stops a worker that has no event for thirty seconds and checks the scripts
  # the worker makes up by the worker's URL; WebKit drops the cache writes of a worker terminated
  # just after them — each found here first.
  engines:
    name: browser suite (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        # WebKit needs its system packages, GStreamer among them. Firefox, like Chromium above, has its
        # libraries from the runner image.
        include:
          - browser: webkit
            deps: --with-deps
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # WebKit's packages are 117 MB from Ubuntu's mirror, which some runners reach at 40 kB/s (#77).
      # apt keeps what it fetches in its archive folder, cached here, so a run fetches only what
      # Ubuntu has updated since. The folder is made writable for the restore, which runs as the
      # runner's user; a new key each week keeps the cache from going stale.
      - if: matrix.deps
        id: apt
        run: |
          sudo chmod a+w /var/cache/apt/archives
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - if: matrix.deps
        uses: actions/cache@v6
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-${{ matrix.browser }}-${{ steps.apt.outputs.week }}
          restore-keys: apt-${{ matrix.browser }}-
      - run: pnpm --filter @missing-elements/h5p-offline-player exec playwright install ${{ matrix.deps }} ${{ matrix.browser }}
      # Drops the versions Ubuntu has since replaced, so the cache holds one copy of each package
      # rather than every week's.
      - if: matrix.deps
        run: sudo apt-get autoclean
      - run: pnpm test:engine
        env:
          H5P_TEST_BROWSER: ${{ matrix.browser }}

  # The VS Code extension in a real VS Code, on a display Xvfb gives it, and the .vsix the owner
  # publishes, built from what the tests ran against. The unit tests run in the job above.
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The player and the runtime, which the extension carries.
      - run: pnpm build
      # The editor the tests download, about 150 MB, a new stable a month: kept a week at a time.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: packages/vscode/.vscode-test
          key: vscode-test-${{ steps.week.outputs.week }}
          restore-keys: vscode-test-
      - run: xvfb-run -a pnpm --filter h5p-preview test:vscode
      - run: pnpm --filter h5p-preview package
      - uses: actions/upload-artifact@v4
        with:
          name: h5p-preview-vsix
          path: packages/vscode/*.vsix
